name: Validate and publish standalone site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate pages and diagrams
        run: npm run build:ci

      - name: Validate site
        run: |
          python tests/validate_site.py
          npm test

      - name: Verify generated output is committed
        run: git diff --exit-code

      - name: Assemble Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp ./*.html sitemap.xml robots.txt _site/
          cp -R assets diagrams experiences _site/
          touch _site/.nojekyll

      - name: Upload validated site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
