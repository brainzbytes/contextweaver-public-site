name: Validate and publish brainzbytes.com

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-brainzbytes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate pages and diagrams
        run: npm run build:ci

      - name: Validate site
        run: |
          python tests/validate_site.py
          npm test

      - name: Verify generated output is committed
        run: git diff --exit-code

      - name: Assemble Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp ./*.html sitemap.xml robots.txt CNAME _site/
          cp -R assets diagrams experiences _site/
          touch _site/.nojekyll

      - name: Upload validated site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: _site
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validated site artifact
        uses: actions/download-artifact@v5
        with:
          name: public-site
          path: _site

      - name: Checkout brainzbytes.com publish target
        uses: actions/checkout@v5
        with:
          repository: ajaypunreddy/brainzbytes
          ssh-key: ${{ secrets.BRAINZBYTES_DEPLOY_KEY }}
          path: target
          fetch-depth: 0

      - name: Mirror validated artifact
        run: rsync -a --delete --exclude='.git/' ./_site/ ./target/

      - name: Commit and publish if changed
        working-directory: target
        run: |
          git config user.name "contextweaver-public-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "brainzbytes.com already matches the validated artifact."
          else
            git commit -m "Publish validated ContextWeaver site from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
            git push origin HEAD:main
          fi
