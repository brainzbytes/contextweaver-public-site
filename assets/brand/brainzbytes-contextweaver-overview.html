const stages=[{"label":"Governed intent","title":"Every system begins with explicit purpose.","caption":"Goals, constraints, tenant context, and identity enter as governed intent.","box":[125,147,316,161],"route":[]},{"label":"Governance","title":"Authority is evaluated before execution.","caption":"Policy, entitlements, guardrails, budgets, and evidence requirements bind the run.","box":[475,147,310,161],"route":[[441,228],[475,228]]},{"label":"Studio","title":"Builders compose approved capabilities.","caption":"Agents, MCP tools, knowledge, models, and APIs are assembled without rebuilding the platform.","box":[817,147,308,161],"route":[[785,228],[817,228]]},{"label":"Registry","title":"Only signed immutable releases may run.","caption":"Versioned definitions and evidence create a stable supply chain from authoring to production.","box":[1156,147,314,161],"route":[[1125,228],[1156,228]]},{"label":"Orchestrator","title":"The orchestrator plans and reconciles durable work.","caption":"It resolves the graph, commits the plan, and coordinates recovery without granting itself authority.","box":[125,398,316,161],"route":[[1312,309],[1312,354],[282,354],[282,398]]},{"label":"Agents and MCP","title":"Bounded workers perform specialized actions.","caption":"Agents reason while MCP capabilities execute narrow, policy-scoped operations.","box":[475,398,310,161],"route":[[441,479],[475,479]]},{"label":"Event mesh","title":"Commands, retries, and compensation move durably.","caption":"The event mesh separates services while preserving correlation, leases, and replay.","box":[817,398,308,161],"route":[[785,479],[817,479]]},{"label":"Live services","title":"Approved compositions become scalable services.","caption":"Portable runtime contracts support deployment, replacement, and migration across Kubernetes platforms.","box":[1156,398,314,161],"route":[[1125,479],[1156,479]]},{"label":"Cerebros","title":"Cerebros understands context and intent.","caption":"The reasoning plane retrieves evidence, plans bounded work, and interprets outcomes.","box":[125,648,316,162],"route":[[1312,560],[1312,604],[282,604],[282,648]]},{"label":"Weave","title":"Weave coordinates durable workflows.","caption":"Versioned workflow state, retries, compensation, and human decisions remain explicit and recoverable.","box":[475,648,310,162],"route":[[441,729],[475,729]]},{"label":"Loom","title":"Loom supplies the portable runtime foundation.","caption":"Kubernetes-native infrastructure keeps governed compositions deployable across environments and clouds.","box":[817,648,308,162],"route":[[785,729],[817,729]]},{"label":"Evidence","title":"Every material action returns proof.","caption":"Receipts, traces, approvals, audits, and replay complete the governed feedback loop.","box":[1156,648,314,162],"route":[[1125,729],[1156,729]]}];const params=new URLSearchParams(location.search),embedded=params.get("embedded")==="1",popout=params.get("popout")==="1";const introMode=params.get("intro")==="1";document.body.classList.toggle("embedded",embedded);document.body.classList.toggle("popout",popout);
const byId=id=>document.getElementById(id),focusLayer=byId("focusLayer"),routeLayer=byId("routeLayer"),progress=byId("progress");let index=0,playing=true,timer=0;const factoryPlane=byId("factoryPlane"),architectureCanvas=byId("architectureCanvas");function syncFactoryPlane(stageIndex=index){factoryPlane.contentWindow?.postMessage({type:"contextweaver-factory-stage",stage:Math.min(2,Math.floor(stageIndex/4))},location.origin)}factoryPlane.addEventListener("load",()=>syncFactoryPlane());function showFactoryPlane(){clearTimeout(timer);if(typeof stopSpeech==="function")stopSpeech();architectureCanvas.hidden=true;factoryPlane.hidden=false;syncFactoryPlane(index);timer=setTimeout(completeIntro,2200)}const jazz=byId("jazz");let audioStarted=false,musicStarted=false,musicStartPending=false,musicEnabled=true,narrationEnabled=true,storyStarted=false,narratorVoice=null,voiceLoadPromise=null,speechToken=0,speechKeepAlive=0,introLeadInTimer=0;jazz.volume=.2;

  {label:"Ava",pattern:/Microsoft Ava/i},{label:"Emma",pattern:/Microsoft Emma/i},
  {label:"Michelle",pattern:/Microsoft Michelle/i},{label:"Sonia",pattern:/Microsoft Sonia/i},
  {label:"Samantha",pattern:/Samantha/i},{label:"Zira",pattern:/Microsoft Zira/i},

function chooseNarrator(){
  if(!("speechSynthesis" in window))return null;
  const voices=speechSynthesis.getVoices(),englishVoices=voices.filter(voice=>/^en(?:-|_)/i.test(voice.lang));

    englishVoices.find(voice=>voice.default)||englishVoices.find(voice=>voice.localService)||englishVoices[0]||voices.find(voice=>voice.default)||voices[0]||null;

}
chooseNarrator();
if("speechSynthesis" in window){speechSynthesis.addEventListener?.("voiceschanged",chooseNarrator);speechSynthesis.onvoiceschanged=chooseNarrator}
function waitForNarrator(){
  const selected=chooseNarrator();if(selected||!("speechSynthesis" in window))return Promise.resolve(selected);
  if(!voiceLoadPromise)voiceLoadPromise=new Promise(resolve=>{const started=performance.now();const poll=()=>{const voice=chooseNarrator();if(voice||performance.now()-started>=5000){voiceLoadPromise=null;resolve(voice);return}setTimeout(poll,60)};setTimeout(poll,60)});
  return voiceLoadPromise;

    utterance.onend=()=>{if(token!==speechToken)return;clearTimeout(startGuard);clearTimeout(timer);clearInterval(speechKeepAlive);speechKeepAlive=0;jazz.volume=musicEnabled?.2:0;timer=setTimeout(advance,900)};
    utterance.onerror=()=>{if(token!==speechToken)return;if(!started){retry();return}clearTimeout(startGuard);clearTimeout(timer);clearInterval(speechKeepAlive);speechKeepAlive=0;jazz.volume=musicEnabled?.2:0;scheduleFallback(stage)};
    speechSynthesis.resume();speechSynthesis.speak(utterance)
  };
  setTimeout(()=>startUtterance(),120)
}
function narrationText(stage){return stage.title+". "+stage.caption}
function stopSpeech(){speechToken+=1;clearInterval(speechKeepAlive);speechKeepAlive=0;if("speechSynthesis" in window)speechSynthesis.cancel();jazz.volume=musicEnabled?.2:0}
function fallbackDelay(stage){return Math.max(6500,Math.min(10500,narrationText(stage).length*52))}

stages.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.ariaLabel=`Open stage ${i+1}: ${s.label}`;b.onclick=()=>{index=i;render()};progress.append(b)});

async function beginAudio(){if(musicStarted||musicStartPending||!musicEnabled)return musicStarted;musicStartPending=true;if("speechSynthesis" in window)speechSynthesis.resume();try{await jazz.play();musicStarted=true;return true}catch{return false}finally{musicStartPending=false}};function startNarratedStory(){if(storyStarted)return;storyStarted=true;audioStarted=true;clearTimeout(introLeadInTimer);render(true)};function scheduleNarratedStory(){clearTimeout(introLeadInTimer);introLeadInTimer=setTimeout(startNarratedStory,10000)};function unlockFromGesture(event){if(event?.isTrusted===false)return false;beginAudio();return true};window.unlockIntroAudio=()=>beginAudio();window.isIntroAudioUnlocked=()=>musicStarted;window.isIntroNarrationStarted=()=>storyStarted;byId("music").onclick=async()=>{musicEnabled=!musicEnabled;byId("music").ariaPressed=String(musicEnabled);byId("music").textContent=musicEnabled?"Music on":"Music off";if(musicEnabled){await beginAudio()}else{jazz.pause();musicStarted=false}};byId("narration").onclick=()=>{narrationEnabled=!narrationEnabled;byId("narration").ariaPressed=String(narrationEnabled);byId("narration").textContent=narrationEnabled?"Narration on":"Narration off";if(narrationEnabled){if(!storyStarted)startNarratedStory();else{audioStarted=true;speak(stages[index])}}else{stopSpeech();scheduleFallback(stages[index])}};addEventListener("pointerdown",event=>unlockFromGesture(event),{capture:true});addEventListener("keydown",event=>unlockFromGesture(event),{capture:true});addEventListener("pagehide",()=>{clearTimeout(timer);clearTimeout(introLeadInTimer);stopSpeech();jazz.pause()});
